<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在跳转 | 个人作品集</title>
    <script>
      (function () {
        var routeRoots = {
          works: true,
          resume: true
        };
        var pathSegments = window.location.pathname.split("/").filter(Boolean);
        var hostname = window.location.hostname;
        var isGithubHost = /(^|\.)github\.io$/i.test(hostname);
        var firstSegment = pathSegments[0];
        var firstIsRouteRoot = Boolean(routeRoots[firstSegment]) || firstSegment === "404.html";
        var basePath = "";

        if (isGithubHost && pathSegments.length > 1 && !firstIsRouteRoot) {
          basePath = "/" + firstSegment;
        }

        var routeSegments = basePath ? pathSegments.slice(1) : pathSegments.slice();

        if (routeSegments[routeSegments.length - 1] === "404.html") {
          routeSegments = routeSegments.slice(0, -1);
        }

        var routePath = routeSegments.length ? "/" + routeSegments.join("/") : "/";
        window.location.replace(basePath + "/#" + routePath + window.location.search + window.location.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5efe6;
        color: #191919;
      }

      main {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在返回作品集首页</h1>
      <p>如果页面没有自动跳转，可以直接回到首页继续浏览。</p>
      <p><a href="./">打开首页</a></p>
    </main>
  </body>
</html>
