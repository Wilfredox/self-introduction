<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页方案 C</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-header__inner">
        <div class="page-title">方案 C <small>居中题签 + 规整拼贴台面</small></div>
        <nav class="page-nav">
          <a href="index.html">方向总览</a>
          <a href="works.html">作品列表</a>
          <a href="project.html">作品详情</a>
          <a href="resume.html">简历页</a>
          <a href="admin.html">后台页</a>
        </nav>
      </div>
    </header>

    <main class="home-page">
      <div class="home-shell home-c">
        <section class="home-head home-head--c">
          <p class="eyebrow">Portfolio Journal / 2026 Edition</p>
          <h1 class="headline-xl">林岚的作品记录</h1>
          <p class="lead">以内容组织和界面判断为核心，做清楚、耐看、能被招聘方记住的数字作品。</p>
          <div class="home-head__contact">
            <span>hello@linlan.design</span>
            <span>上海 / 可远程协作 / 简历在线预览与下载</span>
          </div>
        </section>

        <section class="home-canvas collage-shell" data-variant="c">
          <div class="home-canvas__toolbar">
            <button type="button" data-zoom="out">−</button>
            <button type="button" data-zoom="reset">1:1</button>
            <button type="button" data-zoom="in">＋</button>
          </div>
          <div class="home-canvas__hint">整体更克制，适合希望首页气质更成熟、排版更规整的方向。</div>
          <div class="collage-viewport">
            <div class="collage-track"></div>
          </div>
          <div class="canvas-overlay"></div>
        </section>

        <div class="canvas-caption">
          <p class="lead">方案 C 保留拼贴的记忆点，但通过更强的中轴和边界秩序，让整站气质更像一本安静的中文杂志。</p>
          <div class="tag-row">
            <span class="tag">适合成熟克制路线</span>
            <span class="tag">画面更整齐</span>
            <span class="tag">居中展开更有展览感</span>
          </div>
        </div>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
