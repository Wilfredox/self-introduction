<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录页高保真稿</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-header__inner">
        <div class="page-title">后台登录页 <small>单管理员 / 清晰可信</small></div>
        <nav class="page-nav">
          <a href="index.html">A 版总览</a>
          <a href="admin.html">后台页</a>
          <a href="resume.html">简历页</a>
        </nav>
      </div>
    </header>

    <main class="admin-login-page">
      <div class="login-shell">
        <div class="login-layout login-layout--refined">
          <section class="login-note">
            <p class="eyebrow">Admin Access</p>
            <h1 class="headline-lg">后台登录页高保真稿</h1>
            <p class="lead">
              登录页保留和前台一致的纸面气质，但视觉显著收束。这里的重点不是“好看”，而是让单管理员迅速、稳定、低干扰地进入管理界面。
            </p>
            <div class="tag-row">
              <span class="tag">邮箱 / 密码</span>
              <span class="tag">找回入口</span>
              <span class="tag">单管理员</span>
            </div>
          </section>

          <section class="login-card login-card--refined">
            <h2>登录后台</h2>
            <div class="form-grid">
              <label class="field">
                <span>邮箱</span>
                <input type="email" placeholder="name@example.com" />
              </label>
              <label class="field">
                <span>密码</span>
                <input type="password" placeholder="输入密码" />
              </label>
            </div>
            <div class="resume-actions">
              <button class="button" type="button">进入后台</button>
              <button class="text-button" type="button">忘记密码</button>
            </div>
            <p class="muted">注：本轮设计上仅保留最必要动作，不加入注册、邀请或多管理员入口。</p>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
